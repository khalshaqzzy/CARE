packages:
  - apps/*
  - packages/*

overrides:
  brace-expansion@^1.0.0: 1.1.20
  brace-expansion@^2.0.0: 2.1.6
  brace-expansion@^5.0.0: 5.0.11
  deepmerge-ts: 8.0.0
  fast-uri@^3.0.0: 3.1.7
  js-yaml@^4.1.0: 4.3.2
  multer@^2.0.0: 2.3.0
  path-to-regexp: 8.4.2
  undici@^8.0.0: 8.10.2

allowBuilds:
