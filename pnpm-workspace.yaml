packages:
  - apps/*
  - packages/*

overrides:
  deepmerge-ts: 8.0.0
  path-to-regexp: 8.4.2

allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  argon2: true
  esbuild: true
  prisma: true
  sharp: true

minimumReleaseAgeExclude:
  - '@tanstack/query-core@5.102.4'
  - '@tanstack/react-query@5.102.4'
