<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0b63e5" />
    <title>CARE sedang offline</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f3f5f7;
        color: #171a1f;
      }
      .card {
        max-width: 32rem;
        margin: 1rem;
        padding: 2rem;
        border: 1px solid #e3e7ec;
        border-radius: 1.25rem;
        background: #fff;
        text-align: center;
      }
      button {
        min-height: 44px;
        padding: 0.75rem 1rem;
        border: 0;
        border-radius: 0.75rem;
        color: #fff;
        background: #0b63e5;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>CARE tidak dapat terhubung</h1>
      <p>App shell tersedia, tetapi data terbaru dan seluruh tindakan membutuhkan koneksi.</p>
      <button onclick="location.reload()">Coba lagi</button>
    </main>
  </body>
</html>
