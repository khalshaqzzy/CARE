services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: care
      POSTGRES_PASSWORD: care_local
      POSTGRES_DB: care
    ports:
      - '127.0.0.1:54329:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U care -d care']
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - care_postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres-init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro

volumes:
  care_postgres_data:
