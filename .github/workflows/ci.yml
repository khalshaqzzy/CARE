name: Backend CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

permissions:
  contents: read
  security-events: write

jobs:
  quality:
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: care
          POSTGRES_PASSWORD: care_ci
          POSTGRES_DB: care_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U care -d care_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://care:care_ci@localhost:5432/care_test
      RELEASE_SHA: ci
      SESSION_HASH_SECRET: ci-session-hash-secret-32-characters
      SESSION_CSRF_SECRET: ci-session-csrf-secret-32-characters
      AUTH_THROTTLE_SECRET: ci-auth-throttle-secret-32-characters
      CURSOR_SIGNING_SECRET: dddddddddddddddddddddddddddddddd
      OUTBOX_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 11.8.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version-file: .node-version, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm migrations:destructive-check
      - run: pnpm --filter @care/api prisma:migrate:deploy
      - run: pnpm test:integration
      - run: pnpm test:security
      - run: pnpm seed:performance
      - run: pnpm test:performance
      - run: pnpm openapi:check
      - run: pnpm build
      - run: docker compose config --quiet
      - run: git diff --check

  secrets:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@42947a340483f03ba47bb1a039b2c519aab3df85 # v3
        with: { languages: javascript-typescript }
      - uses: github/codeql-action/analyze@42947a340483f03ba47bb1a039b2c519aab3df85 # v3
